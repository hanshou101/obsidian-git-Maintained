name: Build obsidian plugin

on:
    push:
        tags:
            - "*"

env:
    PLUGIN_NAME: git-maintained

permissions:
    id-token: write
    contents: write
    attestations: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: pnpm/action-setup@v6
              with:
                  version: latest
            - name: Verify manifest version matches tag
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
                  if [ "$MANIFEST_VERSION" != "$TAG" ]; then
                      echo "Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
                      exit 1
                  fi
            - name: Build
              id: build
              run: |
                  pnpm install --frozen-lockfile
                  # obsidian-git-Maintained: upstream's `pnpm run build --if-present` hands
                  # `--if-present` to the build script, and the Vite CLI rejects it.
                  pnpm run build
                  # The released bundle must be the tracked, reviewed main.js.
                  git diff --exit-code --stat -- main.js
                  mkdir ${{ env.PLUGIN_NAME }}
                  cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
                  zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}
            - name: Extract release notes from annotated tag
              run: |
                  # obsidian-git-Maintained: the annotated tag's message is the release body.
                  # Fetch the tag object itself, in case the checkout left a lightweight ref.
                  git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
                  git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
                  if [ ! -s release-notes.md ]; then
                      echo "Release ${GITHUB_REF_NAME} of obsidian-git-Maintained." > release-notes.md
                  fi
                  echo "" >> release-notes.md
                  echo "See [MAINTENANCE.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/MAINTENANCE.md) for how this edition differs from upstream." >> release-notes.md
            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
                      ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.ref }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: false
                  body_path: release-notes.md
                  draft: false
                  prerelease: false
                  files: |
                      main.js
                      manifest.json
                      styles.css
                      ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
